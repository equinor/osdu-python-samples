name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      # Both dependencies come from PyPI now, so CI can install what a user would
      # install. Previously they were pinned to sibling checkouts, which CI could
      # not resolve -- so nothing here ever imported the client.
      - name: Install
        run: uv sync --extra dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check src

      # Smoke test: proves the published client installs and every sample module
      # imports against it. `list` enumerates the registry without contacting
      # OSDU, so it needs no credentials. The samples themselves are exercised
      # against a live instance separately.
      - name: Smoke test
        run: uv run osdu-samples list

      - name: Build wheel and sdist
        run: uv build --out-dir dist
