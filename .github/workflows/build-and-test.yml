name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Both dependencies come from PyPI now, so CI can install what a user would
      # install. Previously they were pinned to sibling checkouts, which CI could
      # not resolve -- so nothing here ever imported the client.
      - name: Install
        run: uv sync --extra dev --locked

      - name: Lint (ruff)
        run: uv run --locked ruff check src tests

      - name: Unit tests
        run: uv run --locked pytest -q

      # Smoke test: proves the published client installs and every sample module
      # imports against it. `list` enumerates the registry without contacting
      # OSDU, so it needs no credentials. The samples themselves are exercised
      # against a live instance separately.
      - name: Smoke test
        run: uv run --locked osdu-samples list

      - name: Build wheel and sdist
        run: uv build --out-dir dist
