name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint (ruff)
        # Run ruff standalone via uvx so we don't have to resolve the project's
        # runtime dependencies — osdu-python-client and osdu-python-models are
        # sibling checkouts (see [tool.uv.sources]) and aren't on a public index.
        run: uvx ruff check src

      - name: Build wheel and sdist
        # Packaging check: the setuptools build backend does not need the runtime
        # dependencies installed, so this works without the sibling checkouts.
        run: uv build --out-dir dist
