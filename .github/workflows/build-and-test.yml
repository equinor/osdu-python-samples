name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint (ruff)
        # Run ruff standalone via uvx so we don't have to resolve the project's
        # runtime dependencies — osdu-python-client and osdu-python-models are
        # sibling checkouts (see [tool.uv.sources]) and aren't on a public index.
        run: uvx ruff check src

      - name: Build wheel and sdist
        # Packaging check: the setuptools build backend does not need the runtime
        # dependencies installed, so this works without the sibling checkouts.
        run: uv build --out-dir dist
